name: Build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Check, test, and build ulik.no
        run: |
          for attempt in 1 2 3; do
            if bun run check; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            delay=$((attempt * 5))
            echo "Check failed (attempt $attempt/3); retrying in ${delay}s."
            sleep "$delay"
          done
          bun run test -- --run
          bun run build

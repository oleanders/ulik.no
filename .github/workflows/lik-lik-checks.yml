name: Optical illusion browser checks

on:
  pull_request:
    paths:
      - 'src/routes/projects/lik-lik/**'
      - 'src/lib/projects.ts'
      - 'src/lib/components/ProjectPreview.svelte'
      - 'e2e/lik-lik.spec.ts'
      - '.github/workflows/lik-lik-checks.yml'

permissions:
  contents: read

jobs:
  illusions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test e2e/lik-lik.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optical-illusion-browser-results
          path: test-results/
          retention-days: 7

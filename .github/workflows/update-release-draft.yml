name: Update release draft

on:
  push:
    branches:
      - main
  pull_request_target:
    types: [opened, reopened, synchronize]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: read

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lag nytt endelig versjonsnummer
        uses: wendbv/calver-tag-action@v2.0.0
        id: tag-version
        with:
          output-only: true
          prefix: 'v'

      - run: echo "Version ${{ steps.tag-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY

      - name: Draft release med Release Drafter
        id: rd
        uses: release-drafter/release-drafter@v7
        with:
          version: ${{ steps.tag-version.outputs.version }}
          tag: ${{ steps.tag-version.outputs.version }}
          name: ${{ steps.tag-version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Append commit-liste fra main
        if: steps.rd.outputs.id != ''
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ steps.rd.outputs.id }}
          RD_BODY: ${{ steps.rd.outputs.body }}
          TAG: ${{ steps.tag-version.outputs.version }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const releaseId = Number(process.env.RELEASE_ID);
            const currentBody = process.env.RD_BODY || '';
            const branch = context.payload.repository.default_branch || 'main';

            let prevTag = '';
            try {
              const { data: latest } = await github.rest.repos.getLatestRelease({ owner, repo });
              prevTag = latest.tag_name || '';
            } catch {}

            if (!prevTag) return;

            const { data } = await github.rest.repos.compareCommitsWithBasehead({
              owner, repo, basehead: `${prevTag}...${branch}`
            });
            if (!data.commits?.length) return;

            const lines = data.commits
              .filter(c => !/^Merge pull request\b/.test(c.commit.message))
              .map(c => `* ${c.commit.message.split('\n')[0]} (${c.sha.substring(0,7)})`)
              .join('\n');

            const section = `\n${lines}\n`;
            const updated = currentBody.includes('## Commit-liste') ? currentBody : currentBody + section;

            await github.rest.repos.updateRelease({ owner, repo, release_id: releaseId, body: updated, tag_name: process.env.TAG });

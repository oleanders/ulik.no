name: Elm browser checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Check formatting and all browser flows
        run: |
          bun run lint
          bun run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: elm-browser-results
          path: test-results/
          retention-days: 7

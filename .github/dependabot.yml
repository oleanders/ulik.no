version: 2
updates:
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "auto-merge"
      - "npm"
    assignees:
      - "oleanders"
    groups:
      all-npm-dependencies:
        patterns:
          - "*"
      bun-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "auto-merge"
      - "github-actions"
    assignees:
      - "oleanders"
    groups:
      github-actions:
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
